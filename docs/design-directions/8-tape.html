<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="theme.js"></script>
<title>Direction 8 — Tape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap">
<style>
:root{
  --bg:#0A0A0A; --panel:#111213; --sunk:#161819;
  --ink:#E8E8E6; --ink-2:#9B9C99; --ink-3:#6A6C69;
  --line:#212322;
  --live:#7DD3A0; --warn:#E8B366; --neg:#E58270; --key:#8AB4F8;
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Inter',system-ui,sans-serif;
}
/* ── light: paper terminal ──────────────────── */
:root{
  --bg:#F7F7F5; --panel:#FFFFFF; --sunk:#EFEFEC;
  --ink:#141514; --ink-2:#4E504D; --ink-3:#83867F;
  --line:#E2E2DE;
  --live:#0A7A3D; --warn:#8A5A00; --neg:#B4231A; --key:#1D5FD0; --on-live:#F2FBF5;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0A0A; --panel:#111213; --sunk:#161819;
  --ink:#E8E8E6; --ink-2:#9B9C99; --ink-3:#6A6C69;
  --line:#212322;
  --live:#7DD3A0; --warn:#E8B366; --neg:#E58270; --key:#8AB4F8; --on-live:#06170E;
}}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --panel:#111213; --sunk:#161819;
  --ink:#E8E8E6; --ink-2:#9B9C99; --ink-3:#6A6C69;
  --line:#212322;
  --live:#7DD3A0; --warn:#E8B366; --neg:#E58270; --key:#8AB4F8; --on-live:#06170E;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);
  -webkit-font-smoothing:antialiased;font-size:13.5px;line-height:1.65;padding-bottom:80px}

.bar{border-bottom:1px solid var(--line);padding:11px 18px;display:flex;gap:12px;
  align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--panel);
  position:sticky;top:0;z-index:6}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--live);
  box-shadow:0 0 0 0 rgba(125,211,160,.6);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(125,211,160,0)}100%{box-shadow:0 0 0 0 rgba(125,211,160,0)}}
.meta{font-size:10.5px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
.flag{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--warn);
  border:1px solid rgba(232,179,102,.35);padding:4px 8px;border-radius:3px}

.wrap{max-width:820px;margin:0 auto;padding:26px 18px}
h1{font-family:var(--sans);font-size:clamp(24px,4vw,34px);font-weight:600;letter-spacing:-.025em;
  margin:0;line-height:1.1}
.lede{font-family:var(--sans);font-size:16px;color:var(--ink-2);margin:10px 0 0;max-width:52ch;font-weight:300}

/* ── the streaming tape ─────────────────────── */
.tape{margin-top:26px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tapehead{padding:9px 15px;background:var(--sunk);border-bottom:1px solid var(--line);
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);
  display:flex;justify-content:space-between;gap:10px}
.stream{padding:14px 15px 18px;min-height:330px}
.ln{display:flex;justify-content:space-between;gap:14px;padding:4px 0;opacity:0;
  transform:translateX(-6px);align-items:baseline}
.ln.on{opacity:1;transform:none;transition:opacity .22s,transform .22s}
.ln .l{color:var(--ink-2)}
.ln .l .tick{color:var(--live);margin-right:9px}
.ln .l .src{display:block;color:var(--ink-3);font-size:10.5px;margin:1px 0 0 20px}
.ln .v{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
.ln.head{color:var(--ink-3);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.ln.tot{border-top:1px solid var(--line);margin-top:8px;padding-top:9px;font-weight:700;color:var(--ink)}
.ln.res{border-top:2px solid var(--live);margin-top:10px;padding-top:12px;font-size:17px;font-weight:700}
.ln.res .v{color:var(--live)}
.neg{color:var(--neg)}
.cursor{display:inline-block;width:8px;height:15px;background:var(--live);vertical-align:-2px;
  animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hidden{display:none}

/* ── skeleton while "computing" ─────────────── */
.skel{height:11px;border-radius:3px;background:linear-gradient(90deg,var(--sunk) 0%,var(--line) 40%,var(--sunk) 80%);
  background-size:220% 100%;animation:sweep 1.25s linear infinite}
@keyframes sweep{to{background-position:-220% 0}}
.skelrow{display:flex;justify-content:space-between;gap:16px;padding:7px 0}
.skelrow .a{flex:1;max-width:300px}.skelrow .b{width:92px}

/* ── result ─────────────────────────────────── */
.foot{margin-top:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.foot .k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.foot .big{font-size:30px;font-weight:700;color:var(--live);font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;line-height:1.2}
.spacer{flex:1}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;
  background:var(--live);color:var(--on-live);border:0;border-radius:6px;padding:14px 22px;cursor:pointer;
  transition:transform .1s,filter .15s;position:relative;overflow:hidden}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:translateY(1px)}
.btn:disabled{background:var(--sunk);color:var(--ink-3);cursor:not-allowed}
.btn .pg{position:absolute;left:0;bottom:0;height:2px;background:rgba(255,255,255,.6);width:0}
.replay{background:none;border:1px solid var(--line);color:var(--ink-2);border-radius:6px;
  padding:12px 15px;font-family:var(--mono);font-size:11px;cursor:pointer;letter-spacing:.1em}
.replay:hover{border-color:var(--ink-3);color:var(--ink)}
.tag{position:fixed;left:12px;bottom:12px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  background:var(--live);color:var(--on-live);padding:7px 11px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="bar">
  <div class="brand"><span class="pulse"></span>wapsi<span class="meta" style="margin-left:8px">engine v2.1 · ruleset AY2026-27-new</span></div>
  <span class="flag">Sample data · not a filing</span>
</div>

<div class="wrap">
  <h1>Your return, computed line by line</h1>
  <p class="lede">Nothing here is hidden behind a spinner. Every step of the calculation is shown as it runs,
  with the document each figure came from.</p>

  <div class="tape">
    <div class="tapehead"><span>computation trace</span><span id="clock">00.00s</span></div>
    <div class="stream" id="stream">
      <div class="skelrow" id="sk1"><div class="a skel"></div><div class="b skel"></div></div>
      <div class="skelrow" id="sk2"><div class="a skel"></div><div class="b skel"></div></div>
      <div class="skelrow" id="sk3"><div class="a skel"></div><div class="b skel"></div></div>
    </div>
  </div>

  <div class="foot">
    <div>
      <div class="k">Refund due</div>
      <div class="big" id="big">—</div>
    </div>
    <div class="spacer"></div>
    <button class="replay" id="replay">↻ replay trace</button>
    <button class="btn" id="file" disabled>File return<span class="pg"></span></button>
  </div>
</div>

<div class="tag">Direction 8 — Tape</div>

<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const R = n => '₹' + n.toLocaleString('en-IN');

const LINES = [
  {h:'reported about you'},
  {l:'salary',            s:'Meridian Systems · Form 16 · 14 Jun',   v:R(1240000)},
  {l:'tds deducted',      s:'Meridian Systems · quarterly · 14 Jun', v:R(97920)},
  {l:'savings interest',  s:'State Bank · AIS · 2 Jun',              v:R(3480)},
  {h:'claimed'},
  {l:'standard deduction',s:'auto-applied · all salaried filers',    v:R(75000)},
  {l:'80C — lic + pf',    s:'entered by you · 21 Jun',               v:R(150000)},
  {h:'compute'},
  {l:'gross income',      v:R(1243480)},
  {l:'less deductions',   v:'−'+R(225000), neg:true},
  {l:'taxable income',    v:R(1018480), tot:true},
  {l:'slab tax',          v:R(88000)},
  {l:'cess @ 4%',         v:R(3520)},
  {l:'total liability',   v:R(91520), tot:true},
  {l:'tds credits',       v:'−'+R(97920), neg:true},
  {l:'net position',      v:R(6400), res:true}
];

const stream = document.getElementById('stream'),
      clock  = document.getElementById('clock'),
      big    = document.getElementById('big'),
      fileBtn= document.getElementById('file');
let t0, timer;

function row(d){
  const el = document.createElement('div');
  el.className = 'ln' + (d.h?' head':'') + (d.tot?' tot':'') + (d.res?' res':'');
  if (d.h){ el.textContent = d.h; return el; }
  el.innerHTML = `<span class="l"><span class="tick">✓</span>${d.l}` +
                 (d.s?`<span class="src">${d.s}</span>`:'') + `</span>` +
                 `<span class="v${d.neg?' neg':''}">${d.v}</span>`;
  return el;
}

function run(){
  clearInterval(timer);
  stream.innerHTML = '';
  big.textContent = '—';
  fileBtn.disabled = true;
  fileBtn.firstChild.nodeValue = 'File return';
  fileBtn.querySelector('.pg').style.width = '0%';

  // skeletons first — structure before content
  for (let i=0;i<3;i++){
    const s = document.createElement('div');
    s.className='skelrow'; s.innerHTML='<div class="a skel"></div><div class="b skel"></div>';
    stream.appendChild(s);
  }

  t0 = performance.now();
  timer = setInterval(()=>{ clock.textContent = ((performance.now()-t0)/1000).toFixed(2)+'s'; }, 60);

  const cur = document.createElement('span'); cur.className = 'cursor';
  const delay = reduce ? 0 : 190;

  setTimeout(()=>{
    stream.innerHTML = '';
    stream.appendChild(cur);
    LINES.forEach((d,i)=>{
      setTimeout(()=>{
        const el = row(d);
        stream.insertBefore(el, cur);
        requestAnimationFrame(()=>el.classList.add('on'));
        if (i === LINES.length-1){
          cur.remove();
          clearInterval(timer);
          big.textContent = R(6400);
          fileBtn.disabled = false;
        }
      }, i*delay);
    });
  }, reduce ? 0 : 520);
}

document.getElementById('replay').addEventListener('click', run);

fileBtn.addEventListener('click', ()=>{
  if (fileBtn.dataset.done) return;
  fileBtn.dataset.done = '1';
  const pg = fileBtn.querySelector('.pg'), dur = 1800, s0 = performance.now();
  fileBtn.firstChild.nodeValue = 'filing…';
  const step = t => { const k = Math.min(1,(t-s0)/dur); pg.style.width = k*100+'%';
    if (k<1) requestAnimationFrame(step);
    else fileBtn.firstChild.nodeValue = 'filed ✓ WPS-2026-4471'; };
  requestAnimationFrame(step);
});

run();
</script>
</body>
</html>
